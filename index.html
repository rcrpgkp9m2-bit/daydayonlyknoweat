<div class="card"><b>🔐 账号</b><div class="g">数据保存在本设备浏览器。换设备请先导出备份码，再在新设备登录页导入。</div><input id="xp" type="password" placeholder="输入账号密码以生成备份码" style="margin-top:8px"><div class="row" style="margin-top:8px"><button class="btn s" onclick="exp().catch(e=>tt('导出失败：'+e.message))">生成备份码</button><button class="btn s" onclick="logout()">退出登录</button></div>${XC?`<textarea readonly rows="4" onclick="this.select()">${XC}</textarea><div class="g">复制这串代码，到新设备登录页粘贴导入。</div>`:''}</div>
<div class="card"><b>📍 收货地址</b>${S.addrs.map((x,i)=>`<div class="cp"><div class="row"><span><b>${x.n}</b> ${x.p}</span><span>${i==S.cur?'<span class="tag">当前</span>':`<span class="g" onclick="S.cur=${i};save();R(1)">设为当前</span>`} <span class="g" onclick="S.addrs.splice(${i},1);S.cur=0;save();R(1)">删除</span></span></div><div class="g">${x.a}</div></div>`).join('')}
<div style="margin-top:10px"><input id="an" placeholder="标签（家/公司）"><input id="aa" placeholder="详细地址"><input id="ap" placeholder="手机号"><button class="btn" onclick="let n=$('an').value,a=$('aa').value;if(!a)return;S.addrs.push({n:n||'地址',a,p:$('ap').value});save();R(1)">添加地址</button></div></div>`}
let c=cart(),bar=v=='s'&&c.n?`<div class="bar row"><span onclick="C.o=!C.o;R(1)">🛒 ${c.n}件 <b>¥${c.sum}</b> ▴</span>${c.sum<15?`<button class="btn s" onclick="tt('起送价 ¥15，再点¥${15-c.sum}就能结算')">还差¥${15-c.sum}起送</button>`:`<button class="btn" onclick="C.o=0;go('c')">去结算</button>`}</div>`:'';
$('a').innerHTML=h+bar+ov;
$('n').innerHTML=[['h','🏠','首页'],['o','📋','订单'],['m','👤','我的']].map(x=>`<div class="${v==x[0]||(x[0]=='h'&&'scpi'.includes(v))||(x[0]=='o'&&v=='d')?'on':''}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</div>`).join('');
if(keep)scrollTo(0,y)}
setInterval(()=>{if(cur&&(v=='d'||v=='o'))R(1)},1000);R();
</script></body></html>
